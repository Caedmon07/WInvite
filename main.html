<!DOCTYPE html>
<html lang="en-GB">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Tina & Derek Wedding Details
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Ovo&family=Parisienne&display=swap"
    rel="stylesheet"
  />

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const isUnlocked =
          localStorage.getItem(
            "weddingInviteUnlocked"
          ) === "true";

        const isLocalPreview =
          window.location.protocol === "file:";

        if (
          !isUnlocked &&
          !isLocalPreview
        ) {

          window.location.href =
            "index.html";
        }

      }
    );

  </script>

  <style>

    :root {

      --ink: #2d3340;

      --muted-ink:
        rgba(45,51,64,0.72);

      --blue: #6f879f;

      --deep-blue: #526a84;

      --rose: #8c3348;

      --paper-line:
        rgba(90,100,120,0.12);

      --panel:
        rgba(255,255,255,0.78);
    }

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }

    body {

      min-height: 100vh;

      font-family:
        "Ovo",
        serif;

      background:
        linear-gradient(
          180deg,
          #e9eff4 0%,
          #dce6ee 100%
        );

      color: var(--ink);

      overflow-x: hidden;
    }

    .page {

      min-height: 100vh;

      display: grid;

      place-items: center;

      padding: 40px 18px;
    }

    .invite-card {

      position: relative;

      width:
        min(100%, 780px);

      min-height: 1180px;

      padding:
        clamp(54px, 8vw, 88px)
        clamp(24px, 7vw, 82px);

      background:
        url("base-watercolour.png")
        center / cover no-repeat;

      border:
        1px solid var(--paper-line);

      border-radius: 8px;

      box-shadow:

        0 30px 90px
        rgba(25,35,48,0.12),

        inset 0 0 60px
        rgba(255,255,255,0.28);

      overflow: hidden;

      backdrop-filter: blur(4px);
    }

    .invite-card::before {

      content: "";

      position: absolute;

      inset: 0;

      background:

        url("rose-top-right.png")
        top left / 340px auto no-repeat,

        url("top-right-watercolour.png")
        top right / 520px auto no-repeat,

        url("top-right-splatters.png")
        top right / 600px auto no-repeat,

        url("thistle-bottom-left.png")
        bottom right / 360px auto no-repeat,

        url("bottom-left-watercolour.png")
        bottom left / 520px auto no-repeat,

        url("bottom-left-splatters.png")
        bottom left / 600px auto no-repeat;

      opacity: 0.95;

      pointer-events: none;

      z-index: 0;
    }

    .invite-card::after {

      content: "";

      position: absolute;

      inset: 0;

      background:

        radial-gradient(
          circle at top,
          rgba(255,255,255,0.35),
          transparent 50%
        );

      pointer-events: none;

      z-index: 1;
    }

    .content {

      position: relative;

      z-index: 2;

      max-width: 650px;

      margin: 0 auto;

      background:
        rgba(255,255,255,0.60);

      padding:
        56px 36px;

      border-radius: 32px;

      border:
        1px solid rgba(82,106,132,0.08);

      box-shadow:

        0 12px 36px
        rgba(44,56,76,0.08),

        inset 0 0 20px
        rgba(255,255,255,0.45);

      text-align: center;

      backdrop-filter: blur(6px);
    }

    .eyebrow {

      text-transform: uppercase;

      letter-spacing: 0.24em;

      line-height: 1.9;

      font-size:
        clamp(0.92rem, 2vw, 1.18rem);

      margin-bottom: 34px;

      color:
        rgba(45,51,64,0.78);
    }

    .names {

      font-family:
        "Parisienne",
        cursive;

      font-size:
        clamp(6rem, 15vw, 10rem);

      line-height: 0.88;

      font-weight: 400;

      color: var(--ink);

      margin:
        8px 0 48px;

      letter-spacing: 0.01em;

      text-shadow:

        0 1px 0 rgba(255,255,255,0.65),

        0 3px 10px rgba(0,0,0,0.04);
    }

    .names span {

      display: block;
    }

    .ampersand {

      font-size: 0.44em;

      margin:
        8px 0 4px;

      opacity: 0.94;
    }

    .invite-text {

      max-width: 620px;

      margin:
        0 auto 52px;

      font-size:
        clamp(1.14rem, 2.8vw, 1.46rem);

      line-height: 1.85;

      color:
        rgba(45,51,64,0.84);
    }

    .date-row {

      display: flex;

      justify-content: center;

      align-items: center;

      gap:
        clamp(12px, 3vw, 28px);

      margin:
        34px 0 38px;
    }

    .date-side {

      font-size:
        clamp(1rem, 3vw, 1.65rem);

      text-transform: uppercase;

      letter-spacing: 0.18em;

      color:
        rgba(45,51,64,0.72);
    }

    .date-day {

      font-family:
        "Parisienne",
        cursive;

      font-size:
        clamp(5.2rem, 12vw, 8rem);

      line-height: 0.8;

      color: var(--ink);

      padding:
        0 18px 10px;

      border-left:
        1px solid rgba(82,106,132,0.28);

      border-right:
        1px solid rgba(82,106,132,0.28);
    }

    .time {

      font-size:
        clamp(1.4rem, 4vw, 2rem);

      margin:
        10px 0 14px;

      color:
        rgba(45,51,64,0.86);
    }

    .venue-main {

      font-size:
        clamp(2rem, 5vw, 3.2rem);

      line-height: 1.2;

      margin-bottom: 10px;
    }

    .venue-sub {

      font-size:
        clamp(1rem, 3vw, 1.38rem);

      line-height: 1.7;

      color:
        rgba(45,51,64,0.72);

      margin-bottom: 52px;
    }

    .divider {

      color:
        rgba(82,106,132,0.68);

      font-size: 1.25rem;

      margin:
        42px auto;

      letter-spacing: 0.5em;
    }

    .button-grid {

      max-width: 680px;

      margin:
        34px auto 18px;

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 14px;
    }

    .link-button {

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 58px;

      padding:
        14px 24px;

      border-radius: 999px;

      text-decoration: none;

      color: var(--ink);

      background:
        rgba(255,255,255,0.78);

      border:
        1px solid rgba(82,106,132,0.14);

      font-family:
        "Ovo",
        serif;

      font-size: 1rem;

      transition:

        transform 0.25s ease,

        background 0.25s ease,

        box-shadow 0.25s ease,

        border-color 0.25s ease;
    }

    .link-button:hover {

      transform:
        translateY(-3px);

      background:
        rgba(255,255,255,0.96);

      border-color:
        rgba(82,106,132,0.24);

      box-shadow:

        0 12px 24px
        rgba(44,56,76,0.10);
    }

    .link-button.primary {

      background:
        linear-gradient(
          135deg,
          #667e98,
          #526a84
        );

      color: white;

      border: 0;

      grid-column: 1 / -1;

      box-shadow:

        0 12px 24px
        rgba(82,106,132,0.22);
    }

    .link-button.primary:hover {

      background:
        linear-gradient(
          135deg,
          #728aa5,
          #5c7590
        );
    }

    .footer-note {

      margin-top: 34px;

      color:
        var(--muted-ink);

      font-size: 0.94rem;

      line-height: 1.7;
    }

    @media (max-width: 640px) {

      .content {

        padding:
          42px 24px;
      }

      .invite-card {

        min-height: auto;
      }

      .invite-card::before {

        background:

          url("rose-top-right.png")
          top left / 240px auto no-repeat,

          url("top-right-watercolour.png")
          top right / 340px auto no-repeat,

          url("top-right-splatters.png")
          top right / 380px auto no-repeat,

          url("thistle-bottom-left.png")
          bottom right / 240px auto no-repeat,

          url("bottom-left-watercolour.png")
          bottom left / 340px auto no-repeat,

          url("bottom-left-splatters.png")
          bottom left / 380px auto no-repeat;
      }

      .button-grid {

        grid-template-columns: 1fr;
      }

      .link-button.primary {

        grid-column: auto;
      }
    }

  </style>

</head>

<body>

<main class="page">

  <article class="invite-card">

    <div class="content">

      <p class="eyebrow">

        Together<br>
        with their families

      </p>

      <h1 class="names">

        <span>Tina</span>

        <span class="ampersand">
          &amp;
        </span>

        <span>Derek</span>

      </h1>

      <p class="invite-text">

        Invite you to celebrate love,
        laughter and their happily ever after together.

      </p>

      <div class="date-row">

        <span class="date-side">
          July
        </span>

        <span class="date-day">
          17
        </span>

        <span class="date-side">
          2027
        </span>

      </div>

      <p class="time">
        13:00
      </p>

      <p class="venue-main">
        Auchen Castle
      </p>

      <p class="venue-sub">
        Beattock, Moffat, Scotland DG10 9SH
      </p>

      <div class="divider">
        ♡ ♥ ♡
      </div>

      <div class="button-grid">

        <a
          class="link-button primary"
          href="https://forms.gle/3H6C7PRqrrTAf6n58"
          target="_blank"
          rel="noopener noreferrer"
        >

          ♥ RSVP

        </a>

        <!--
        <a
          class="link-button"
          href="https://forms.gle/tU8nxwpxvzFHDNBY7"
          target="_blank"
          rel="noopener noreferrer"
        >

          🍽 Food & Dietary

        </a>
        -->

        <a
          class="link-button"
          href="https://forms.gle/AYGoGc3aHccZc47z6"
          target="_blank"
          rel="noopener noreferrer"
        >

          🎵 Song Requests

        </a>

        <a
          class="link-button"
          href="https://forms.gle/rdSquKR81UZjZzBm8"
          target="_blank"
          rel="noopener noreferrer"
        >

          🛏 Accommodation

        </a>

      </div>

      <p class="footer-note">

        Please RSVP as soon as possible.<br><br>

        With love,<br>

        Tina & Derek

      </p>

    </div>

  </article>

</main>

</body>
</html>
