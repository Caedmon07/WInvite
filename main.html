<!DOCTYPE html>
<html lang="en-GB">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Tina & Derek Wedding Details
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Ovo&family=Parisienne&display=swap"
    rel="stylesheet"
  />

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const isUnlocked =
          localStorage.getItem(
            "weddingInviteUnlocked"
          ) === "true";

        const isLocalPreview =
          window.location.protocol === "file:";

        if (
          !isUnlocked &&
          !isLocalPreview
        ) {

          window.location.href =
            "index.html";
        }

      }
    );

  </script>

  <style>

    :root {

      --ink: #2d3340;

      --muted-ink:
        rgba(45,51,64,0.72);

      --blue: #6f879f;

      --deep-blue: #526a84;

      --rose: #8c3348;

      --paper-line:
        rgba(90,100,120,0.16);

      --panel:
        rgba(255,255,255,0.78);
    }

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }

    body {

      min-height: 100vh;

      font-family:
        "Ovo",
        serif;

      background:
        #dfe8f0;

      color: var(--ink);

      overflow-x: hidden;
    }

    .page {

      min-height: 100vh;

      display: grid;

      place-items: center;

      padding: 32px 16px;
    }

    .invite-card {

      position: relative;

      width:
        min(100%, 760px);

      min-height: 1100px;

      padding:
        clamp(54px, 8vw, 88px)
        clamp(24px, 7vw, 78px);

      background:
        url("base-watercolour.png")
        center / cover no-repeat;

      border:
        1px solid var(--paper-line);

      border-radius: 4px;

      box-shadow:
        0 24px 70px rgba(22,32,48,0.14);

      overflow: hidden;
    }

    .invite-card::before {

      content: "";

      position: absolute;

      inset: 0;

      background:

        url("rose-top-right.png")
        top left / 210px auto no-repeat,

        url("top-right-watercolour.png")
        top right / 330px auto no-repeat,

        url("top-right-splatters.png")
        top right / 390px auto no-repeat,

        url("thistle-bottom-left.png")
        bottom right / 230px auto no-repeat,

        url("bottom-left-watercolour.png")
        bottom left / 340px auto no-repeat,

        url("bottom-left-splatters.png")
        bottom left / 390px auto no-repeat;

      pointer-events: none;

      z-index: 0;
    }

    .content {

      position: relative;

      z-index: 2;

      max-width: 640px;

      margin: 0 auto;

      background:
        var(--panel);

      padding:
        38px 30px;

      border-radius: 26px;

      border:
        1px solid rgba(82,106,132,0.10);

      box-shadow:
        0 10px 28px rgba(44,56,76,0.08);

      text-align: center;
    }

    .eyebrow {

      text-transform: uppercase;

      letter-spacing: 0.18em;

      line-height: 1.7;

      font-size:
        clamp(1rem, 2.4vw, 1.45rem);

      margin-bottom: 28px;
    }

    .names {

      font-family:
        "Parisienne",
        cursive;

      font-size:
        clamp(5.3rem, 15vw, 9.2rem);

      line-height: 0.9;

      font-weight: 400;

      margin-bottom: 40px;
    }

    .names span {

      display: block;
    }

    .ampersand {

      font-size: 0.52em;
    }

    .invite-text {

      font-size:
        clamp(1.1rem, 3vw, 1.45rem);

      line-height: 1.6;

      margin-bottom: 40px;
    }

    .date-row {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 18px;

      margin-bottom: 34px;
    }

    .date-side {

      font-size:
        clamp(1.2rem, 4vw, 2rem);

      text-transform: uppercase;
    }

    .date-day {

      font-family:
        "Parisienne",
        cursive;

      font-size:
        clamp(4.5rem, 12vw, 7rem);
    }

  </style>

</head>

<body>

<main class="page">

  <article class="invite-card">

    <div class="content">

      <p class="eyebrow">

        Together<br>
        with their families

      </p>

      <h1 class="names">

        <span>Tina</span>

        <span class="ampersand">
          &amp;
        </span>

        <span>Derek</span>

      </h1>

      <p class="invite-text">

        Invite you to celebrate love,
        laughter and their happily ever after together.

      </p>

      <div class="date-row">

        <span class="date-side">
          July
        </span>

        <span class="date-day">
          17
        </span>

        <span class="date-side">
          2027
        </span>

      </div>

    </div>

  </article>

</main>

</body>
</html>
