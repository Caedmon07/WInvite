<!DOCTYPE html>
<html lang="en-GB">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Tina & Derek Wedding Details
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Ovo&family=Parisienne&display=swap"
    rel="stylesheet"
  />

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        const isUnlocked =
          localStorage.getItem(
            "weddingInviteUnlocked"
          ) === "true";

        const isLocalPreview =
          window.location.protocol === "file:";

        if (
          !isUnlocked &&
          !isLocalPreview
        ) {

          window.location.href =
            "index.html";
        }

      }
    );

  </script>

  <style>

    :root {

      --ink: #2d3340;

      --muted-ink:
        rgba(45,51,64,0.72);

      --blue: #6f879f;

      --deep-blue: #526a84;

      --rose: #8c3348;

      --paper-line:
        rgba(90,100,120,0.16);

      --panel:
        rgba(255,255,255,0.78);
    }

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }

    body {

      min-height: 100vh;

      font-family:
        "Ovo",
        serif;

      background:
        #dfe8f0;

      color: var(--ink);

      overflow-x: hidden;
    }

    .page {

      min-height: 100vh;

      display: grid;

      place-items: center;

      padding: 32px 16px;
    }

    .invite-card {

      position: relative;

      width:
        min(100%, 760px);

      min-height: 1100px;

      padding:
        clamp(54px, 8vw, 88px)
        clamp(24px, 7vw, 78px);

      background:
        url("base-watercolour.png")
        center / cover no-repeat;

      border:
        1px solid var(--paper-line);

      border-radius: 4px;

      box-shadow:
        0 24px 70px rgba(22,32,48,0.14);

      overflow: hidden;
    }

    .invite-card::before {

      content: "";

      position: absolute;

      inset: 0;

      background:

        url("rose-top-right.png")
        top left / 210px auto no-repeat,

        url("top-right-watercolour.png")
        top right / 330px auto no-repeat,

        url("top-right-splatters.png")
        top right / 390px auto no-repeat,

        url("thistle-bottom-left.png")
        bottom right / 230px auto no-repeat,

        url("bottom-left-watercolour.png")
        bottom left / 340px auto no-repeat,

        url("bottom-left-splatters.png")
        bottom left / 390px auto no-repeat;

      pointer-events: none;

      z-index: 0;
    }

    .content {

      position: relative;

      z-index: 2;

      max-width: 640px;

      margin: 0 auto;

      background:
        var(--panel);

      padding:
        42px 34px;

      border-radius: 26px;

      border:
        1px solid rgba(82,106,132,0.10);

      box-shadow:
        0 10px 28px rgba(44,56,76,0.08);

      text-align: center;
    }

    .eyebrow {

      text-transform: uppercase;

      letter-spacing: 0.24em;

      line-height: 1.9;

      font-size:
        clamp(0.92rem, 2vw, 1.18rem);

      margin-bottom: 34px;

      color:
        rgba(45,51,64,0.78);
    }

    .names {

      font-family:
        "Parisienne",
        cursive;

      font-size:
        clamp(5.8rem, 15vw, 9.8rem);

      line-height: 0.88;

      font-weight: 400;

      color: var(--ink);

      margin:
        8px 0 46px;

      letter-spacing: 0.01em;

      text-shadow:
        0 1px 0 rgba(255,255,255,0.55);
    }

    .names span {

      display: block;
    }

    .ampersand {

      font-size: 0.46em;

      margin:
        6px 0 2px;

      opacity: 0.92;
    }

    .invite-text {

      max-width: 620px;

      margin:
        0 auto 52px;

      font-size:
        clamp(1.12rem, 2.8vw, 1.42rem);

      line-height: 1.82;

      color:
        rgba(45,51,64,0.86);
    }

    .date-row {

      display: flex;

      justify-content: center;

      align-items: center;

      gap:
        clamp(12px, 3vw, 26px);

      margin:
        34px 0 36px;
    }

    .date-side {

      font-size:
        clamp(1rem, 3vw, 1.6rem);

      text-transform: uppercase;

      letter-spacing: 0.16em;

      color:
        rgba(45,51,64,0.72);
    }

    .date-day {

      font-family:
        "Parisienne",
        cursive;

      font-size:
        clamp(5rem, 12vw, 7.8rem);

      line-height: 0.8;

      color: var(--ink);

      padding:
        0 18px 10px;

      border-left:
        1px solid rgba(82,106,132,0.32);

      border-right:
        1px solid rgba(82,106,132,0.32);
    }

    .time {

      font-size:
        clamp(1.4rem, 4vw, 2rem);

      margin:
        6px 0 12px;

      color:
        rgba(45,51,64,0.86);
    }

    .venue-main {

      font-size:
        clamp(2rem, 5vw, 3.2rem);

      line-height: 1.2;

      margin-bottom: 10px;
    }

    .venue-sub {

      font-size:
        clamp(1rem, 3vw, 1.4rem);

      line-height: 1.7;

      color:
        rgba(45,51,64,0.72);

      margin-bottom: 52px;
    }

    .divider {

      color:
        rgba(82,106,132,0.7);

      font-size: 1.25rem;

      margin:
        42px auto;

      letter-spacing: 0.5em;
    }

    .gift-poem,
    .info-box {

      max-width: 680px;

      margin:
        0 auto 30px;

      background:
        rgba(255,255,255,0.64);

      border:
        1px solid rgba(82,106,132,0.12);

      border-radius: 24px;

      padding:
        30px 28px;

      line-height: 1.9;

      font-size:
        clamp(1rem, 2.4vw, 1.1rem);

      color:
        rgba(45,51,64,0.86);

      box-shadow:
        0 10px 24px rgba(44,56,76,0.05);
    }

    .gift-poem h2,
    .info-box h2 {

      font-family:
        "Parisienne",
        cursive;

      font-size:
        clamp(2.1rem, 5vw, 3rem);

      font-weight: 400;

      margin-bottom: 18px;

      color: var(--ink);
    }

    .heart-row {

      margin-top: 16px;

      color: var(--rose);

      font-size: 1.35rem;

      letter-spacing: 0.35em;
    }

    .button-grid {

      max-width: 680px;

      margin:
        34px auto 20px;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 12px;
    }

    .link-button {

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 56px;

      padding:
        14px 22px;

      border-radius: 999px;

      text-decoration: none;

      color: var(--ink);

      background:
        rgba(255,255,255,0.82);

      border:
        1px solid rgba(82,106,132,0.18);

      font-family:
        "Ovo",
        serif;

      font-size: 1rem;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .link-button:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,0.96);

      box-shadow:
        0 8px 20px rgba(44,56,76,0.08);
    }

    .link-button.primary {

      background:
        rgba(82,106,132,0.92);

      color: white;

      border: 0;

      grid-column: 1 / -1;
    }

    .footer-note {

      margin-top: 22px;

      color:
        var(--muted-ink);

      font-size: 0.92rem;

      line-height: 1.7;
    }

    @media (max-width: 640px) {

      .button-grid {

        grid-template-columns: 1fr;
      }

      .link-button.primary {

        grid-column: auto;
      }
    }

  </style>

</head>

<body>

<main class="page">

  <article class="invite-card">

    <div class="content">

      <p class="eyebrow">

        Together<br>
        with their families

      </p>

      <h1 class="names">

        <span>Tina</span>

        <span class="ampersand">
          &amp;
        </span>

        <span>Derek</span>

      </h1>

      <p class="invite-text">

        Invite you to celebrate love,
        laughter and their happily ever after together.

      </p>

      <div class="date-row">

        <span class="date-side">
          July
        </span>

        <span class="date-day">
          17
        </span>

        <span class="date-side">
          2027
        </span>

      </div>

      <p class="time">
        13:00
      </p>

      <p class="venue-main">
        Auchen Castle
      </p>

      <p class="venue-sub">
        Beattock, Moffat, Scotland DG10 9SH
      </p>

    </div>

  </article>

</main>

</body>
</html>
