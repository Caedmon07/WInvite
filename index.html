<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tina & Derek Wedding Invitation</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Ovo&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #2d3340;
      --blue: #526a84;
      --rose: #8c3348;
      --paper-line: rgba(90, 100, 120, 0.16);
      --panel: rgba(255, 255, 255, 0.72);
      --panel-strong: rgba(255, 255, 255, 0.82);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      font-family: 'Ovo', serif;
      color: var(--ink);
      background:
        linear-gradient(rgba(255,255,255,0.08), rgba(255,255,255,0.08)),
        url("base-watercolour.png") center / cover no-repeat fixed;
      overflow-x: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.42), transparent 24%),
        radial-gradient(circle at 80% 85%, rgba(197, 213, 231, 0.22), transparent 28%);
      mix-blend-mode: screen;
      opacity: 0.7;
    }
    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      text-align: center;
    }
    .landing-card {
      position: relative;
      width: min(100%, 760px);
      min-height: 980px;
      padding: clamp(40px, 6vw, 72px);
      border: 1px solid var(--paper-line);
      border-radius: 10px;
      box-shadow: 0 24px 70px rgba(22, 32, 48, 0.14), inset 0 0 0 1px rgba(255,255,255,0.45);
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(rgba(255,255,255,0.18), rgba(255,255,255,0.18)), rgba(255,255,255,0.12);
      backdrop-filter: blur(1px);
    }
    .landing-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        url("rose-top-right.png") top left / 240px auto no-repeat,
        url("top-right-watercolour.png") top right / 320px auto no-repeat,
        url("top-right-splatters.png") top right / 430px auto no-repeat,
        url("thistle-bottom-left.png") bottom right / 250px auto no-repeat,
        url("bottom-left-watercolour.png") bottom left / 330px auto no-repeat,
        url("bottom-left-splatters.png") bottom left / 430px auto no-repeat;
      opacity: 0.98;
      z-index: 0;
    }
    .landing-card::after {
      content: "";
      position: absolute;
      inset: 11% 12%;
      pointer-events: none;
      background:
        url("rose-top-right.png") center top / 160px auto no-repeat,
        url("thistle-bottom-left.png") center bottom / 180px auto no-repeat,
        radial-gradient(circle at center, rgba(255,255,255,0.55), rgba(255,255,255,0.12) 68%, transparent 100%);
      opacity: 0.3;
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: clamp(24px, 4vw, 38px);
      background: linear-gradient(180deg, var(--panel-strong), var(--panel));
      border: 1px solid rgba(82,106,132,0.12);
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(44, 56, 76, 0.08);
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: clamp(1rem, 2.4vw, 1.45rem);
      line-height: 1.7;
      margin-bottom: 28px;
    }
    h1 {
      font-family: 'Brittany Signature', 'Great Vibes', cursive;
      font-size: clamp(5rem, 15vw, 9rem);
      line-height: 0.86;
      font-weight: 600;
      margin-bottom: 34px;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255,255,255,0.65);
    }
    .subtitle {
      font-size: clamp(1.15rem, 3vw, 1.55rem);
      line-height: 1.55;
      margin-bottom: 34px;
    }
    .envelope-link {
      display: inline-block;
      text-decoration: none;
      color: inherit;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    .envelope-link.locked {
      opacity: 0.45;
      pointer-events: none;
      filter: grayscale(0.25);
    }
    .envelope {
      position: relative;
      width: min(76vw, 340px);
      height: 210px;
      margin: 0 auto 16px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 22px 28px rgba(20,30,50,0.22));
    }
    .envelope-base {
      position: absolute;
      inset: 54px 0 0;
      background: linear-gradient(145deg, #fffaf0, #e7d8bd);
      border: 1px solid rgba(120,110,93,0.24);
      border-radius: 0 0 18px 18px;
      overflow: hidden;
    }
    .envelope-base::before, .envelope-base::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 56%;
      height: 100%;
      background: rgba(88,120,151,0.10);
    }
    .envelope-base::before {
      left: 0;
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }
    .envelope-base::after {
      right: 0;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }
    .envelope-flap {
      position: absolute;
      left: 0;
      right: 0;
      top: 54px;
      height: 118px;
      background: linear-gradient(145deg, #ffffff, #e8d9bd);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      transform-origin: top center;
      transition: transform 0.7s ease;
      z-index: 3;
    }
    .seal {
      position: absolute;
      left: 50%;
      top: 122px;
      transform: translateX(-50%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8c3348, #5c1c2f);
      color: white;
      display: grid;
      place-items: center;
      z-index: 4;
      font-size: 1.25rem;
      border: 2px solid rgba(255,255,255,0.85);
    }
    .envelope-link:hover .envelope-flap,
    .envelope-link:focus .envelope-flap { transform: rotateX(22deg); }
    .open-note {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.82rem;
      color: rgba(45,51,64,0.72);
    }
    .password-panel {
      margin-top: 30px;
      display: grid;
      gap: 14px;
      justify-items: center;
    }
    .password-label { font-size: 0.95rem; color: rgba(45,51,64,0.76); }
    .password-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .password-input {
      width: min(78vw, 260px);
      min-height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(82,106,132,0.24);
      background: rgba(255,255,255,0.9);
      padding: 0 18px;
      text-align: center;
      font-size: 1rem;
      font-family: 'Ovo', serif;
      color: var(--ink);
      outline: none;
    }
    .unlock-button {
      min-height: 48px;
      border: 0;
      border-radius: 999px;
      padding: 0 22px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font-family: 'Ovo', serif;
      font-size: 0.95rem;
    }
    .password-message {
      min-height: 20px;
      font-size: 0.86rem;
      color: var(--rose);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @media (max-width: 620px) {
      body { background-attachment: scroll; }
      .landing-card {
        min-height: auto;
        padding: 28px 16px;
      }
      .landing-card::before {
        background:
          url("rose-top-right.png") top left / 180px auto no-repeat,
          url("top-right-watercolour.png") top right / 250px auto no-repeat,
          url("top-right-splatters.png") top right / 310px auto no-repeat,
          url("thistle-bottom-left.png") bottom right / 185px auto no-repeat,
          url("bottom-left-watercolour.png") bottom left / 250px auto no-repeat,
          url("bottom-left-splatters.png") bottom left / 320px auto no-repeat;
      }
      .landing-card::after {
        inset: 14% 8%;
        background:
          url("rose-top-right.png") center top / 122px auto no-repeat,
          url("thistle-bottom-left.png") center bottom / 138px auto no-repeat,
          radial-gradient(circle at center, rgba(255,255,255,0.52), rgba(255,255,255,0.08) 68%, transparent 100%);
      }
      .content { padding: 22px 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="landing-card">
      <div class="content">
        <p class="eyebrow">Together<br>with their families</p>
        <h1>Tina<br>&amp;<br>Derek</h1>
        <p class="subtitle">Invite you to celebrate love, laughter,<br>and their happily ever after together.</p>
        <a class="envelope-link locked" id="inviteLink" href="main.html">
          <div class="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-base"></div>
            <div class="seal">♥</div>
          </div>
          <p class="open-note">Invitation locked</p>
        </a>
        <form class="password-panel" id="passwordForm">
          <label class="password-label" for="weddingPassword">Enter the wedding password</label>
          <div class="password-row">
            <input class="password-input" id="weddingPassword" type="password" autocomplete="off" placeholder="Wedding password">
            <button class="unlock-button" type="submit">Unlock</button>
          </div>
          <p class="password-message" id="passwordMessage"></p>
        </form>
      </div>
    </section>
  </main>
  <script>
    const correctPassword = "Auchen2027";
    const passwordForm = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("weddingPassword");
    const passwordMessage = document.getElementById("passwordMessage");
    const inviteLink = document.getElementById("inviteLink");
    const openNote = document.querySelector(".open-note");

    if (sessionStorage.getItem("weddingInviteUnlocked") === "true") {
      unlockInvite();
    }

    passwordForm.addEventListener("submit", function(event) {
      event.preventDefault();
      if (passwordInput.value.trim() === correctPassword) {
        sessionStorage.setItem("weddingInviteUnlocked", "true");
        unlockInvite();
        window.location.href = "main.html";
      } else {
        passwordMessage.textContent = "Sorry, that password is not quite right.";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    function unlockInvite() {
      inviteLink.classList.remove("locked");
      openNote.textContent = "Tap to open";
      passwordForm.style.display = "none";
    }
  </script>
</body>
</html>
