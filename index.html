<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tina & Derek Wedding Invitation</title>

  <style>
    :root {
      --navy: #07142f;
      --ivory: #fff8ec;
      --soft-blue: #dbe7f2;
      --ink: #2d3340;
      --gold: #d9b66f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, 'Times New Roman', serif;
      color: var(--ink);
      background:
        linear-gradient(rgba(255,255,255,0.72), rgba(255,255,255,0.78)),
        url("assets/auchen-castle.jpg") center / cover fixed no-repeat;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      inset: 0;
      background:
        url("assets/floral-top-left.png") top left / min(58vw, 430px) auto no-repeat,
        url("assets/floral-bottom-right.png") bottom right / min(58vw, 430px) auto no-repeat,
        radial-gradient(circle at top right, rgba(88,120,151,0.24), transparent 32%),
        radial-gradient(circle at bottom left, rgba(88,120,151,0.20), transparent 34%);
      opacity: 0.95;
    }

    body::after {
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(7,20,47,0.20));
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      text-align: center;
    }

    .landing-card {
      width: min(100%, 720px);
      padding: clamp(28px, 6vw, 60px);
      background: rgba(255,255,255,0.56);
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 28px;
      box-shadow: 0 28px 90px rgba(7,20,47,0.20);
      backdrop-filter: blur(4px);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: clamp(0.95rem, 3vw, 1.35rem);
      line-height: 1.55;
      margin-bottom: 22px;
    }

    h1 {
      font-family: 'Brush Script MT', 'Segoe Script', cursive;
      font-size: clamp(4.8rem, 16vw, 9rem);
      line-height: 0.82;
      font-weight: 400;
      color: var(--ink);
      margin-bottom: 28px;
    }

    .subtitle {
      font-size: clamp(1.05rem, 3vw, 1.4rem);
      line-height: 1.5;
      margin-bottom: 34px;
    }

    .envelope-link {
      display: inline-block;
      text-decoration: none;
      color: inherit;
    }

    .envelope {
      position: relative;
      width: min(78vw, 360px);
      height: 230px;
      margin: 0 auto 16px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 24px 32px rgba(7,20,47,0.25));
    }

    .envelope-base {
      position: absolute;
      inset: 58px 0 0;
      background: linear-gradient(145deg, #fffaf0, #e7d8bd);
      border: 1px solid rgba(120,110,93,0.24);
      border-radius: 0 0 18px 18px;
      overflow: hidden;
    }

    .envelope-base::before,
    .envelope-base::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 56%;
      height: 100%;
      background: rgba(88,120,151,0.10);
    }

    .envelope-base::before {
      left: 0;
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }

    .envelope-base::after {
      right: 0;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    .envelope-flap {
      position: absolute;
      left: 0;
      right: 0;
      top: 58px;
      height: 124px;
      background: linear-gradient(145deg, #ffffff, #e8d9bd);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      transform-origin: top center;
      transition: transform 0.7s ease;
      z-index: 3;
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 132px;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8c3348, #5c1c2f);
      color: white;
      display: grid;
      place-items: center;
      z-index: 4;
      font-size: 1.25rem;
      border: 2px solid rgba(255,255,255,0.85);
    }

    .envelope-link:hover .envelope-flap,
    .envelope-link:focus .envelope-flap {
      transform: rotateX(22deg);
    }

    .open-note {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 0.82rem;
      color: rgba(45,51,64,0.72);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @media (max-width: 620px) {
      body {
        background-attachment: scroll;
      }

      .landing-card {
        background: rgba(255,255,255,0.68);
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="landing-card">

      <p class="eyebrow">
        Together<br>
        with their families
      </p>

      <h1>
        Tina<br>
        &<br>
        Derek
      </h1>

      <p class="subtitle">
        Invite you to celebrate love, laughter,<br>
        and their happily ever after together.
      </p>

      <a class="envelope-link" href="main.html">

        <div class="envelope">

          <div class="envelope-flap"></div>

          <div class="envelope-base"></div>

          <div class="seal">♥</div>

        </div>

        <p class="open-note">Tap to open</p>

      </a>

    </section>

  </main>

</body>
</html>
