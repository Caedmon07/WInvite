<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tina &amp; Derek Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ovo&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #2c3140;
      --muted: rgba(44, 49, 64, 0.72);
      --blue: #6f879f;
      --soft-blue: #dbe7f2;
      --button: #526a84;
      --rose: #8c3348;
      --paper: #fbfbf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      font-family: 'Ovo', Georgia, serif;
      color: var(--ink);
      background: #f8fbfd url("assets/base-watercolour.png") center / cover fixed no-repeat;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 48px);
      position: relative;
      isolation: isolate;
      text-align: center;
    }

    .art {
      position: fixed;
      pointer-events: none;
      z-index: -1;
      user-select: none;
    }

    .art.top-watercolour {
      top: 0;
      right: 0;
      width: min(72vw, 680px);
      opacity: 0.9;
    }

    .art.top-rose {
      top: 0;
      left: 0;
      width: min(42vw, 360px);
      opacity: 0.82;
    }

    .art.top-splatter {
      top: 0;
      right: 0;
      width: min(58vw, 520px);
      opacity: 0.35;
    }

    .art.bottom-watercolour {
      bottom: 0;
      left: 0;
      width: min(72vw, 680px);
      opacity: 0.78;
    }

    .art.bottom-thistle {
      bottom: 0;
      right: 0;
      width: min(42vw, 360px);
      opacity: 0.84;
    }

    .art.bottom-splatter {
      bottom: 0;
      left: 0;
      width: min(58vw, 520px);
      opacity: 0.35;
    }

    .landing-card {
      width: min(100%, 720px);
      min-height: min(92vh, 980px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(34px, 7vw, 78px) clamp(20px, 6vw, 62px);
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 28px 90px rgba(82, 106, 132, 0.12);
      backdrop-filter: blur(1px);
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: clamp(1.28rem, 4vw, 2.25rem);
      line-height: 1.42;
      margin-bottom: clamp(24px, 4vw, 40px);
    }

    h1 {
      font-family: 'Brittany Signature', 'Brush Script MT', 'Segoe Script', cursive;
      font-size: clamp(5.3rem, 17vw, 10rem);
      line-height: 0.78;
      font-weight: 400;
      margin-bottom: clamp(32px, 5vw, 52px);
    }

    .ampersand {
      font-family: 'Ovo', Georgia, serif;
      font-size: 0.56em;
      line-height: 1;
      display: block;
      margin: 0.05em 0;
    }

    .subtitle {
      max-width: 620px;
      font-size: clamp(1.25rem, 3.4vw, 1.75rem);
      line-height: 1.45;
      margin-bottom: clamp(28px, 5vw, 44px);
    }

    .envelope-link {
      display: inline-block;
      color: inherit;
      text-decoration: none;
      transition: opacity 0.25s ease, filter 0.25s ease;
    }

    .envelope-link.locked {
      opacity: 0.48;
      pointer-events: none;
      filter: grayscale(0.2);
    }

    .envelope {
      position: relative;
      width: min(72vw, 330px);
      height: 205px;
      margin: 0 auto 12px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 22px 30px rgba(44, 49, 64, 0.18));
    }

    .envelope-base {
      position: absolute;
      inset: 54px 0 0;
      background: linear-gradient(145deg, #fffaf0, #e7d8bd);
      border: 1px solid rgba(82,106,132,0.20);
      border-radius: 0 0 16px 16px;
      overflow: hidden;
    }

    .envelope-base::before,
    .envelope-base::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 56%;
      height: 100%;
      background: rgba(111,135,159,0.10);
    }

    .envelope-base::before { left: 0; clip-path: polygon(0 0, 100% 100%, 0 100%); }
    .envelope-base::after { right: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%); }

    .envelope-flap {
      position: absolute;
      left: 0;
      right: 0;
      top: 54px;
      height: 112px;
      background: linear-gradient(145deg, #ffffff, #e8d9bd);
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      transform-origin: top center;
      transition: transform 0.7s ease;
      z-index: 3;
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 122px;
      transform: translateX(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8c3348, #5c1c2f);
      color: white;
      display: grid;
      place-items: center;
      z-index: 4;
      font-size: 1.18rem;
      border: 2px solid rgba(255,255,255,0.86);
    }

    .envelope-link:hover .envelope-flap,
    .envelope-link:focus .envelope-flap { transform: rotateX(22deg); }

    .open-note {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .password-panel {
      margin-top: 26px;
      display: grid;
      gap: 12px;
      justify-items: center;
    }

    .password-label {
      font-size: 1rem;
      color: var(--muted);
    }

    .password-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .password-input {
      width: min(78vw, 270px);
      min-height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(82,106,132,0.24);
      background: rgba(255,255,255,0.74);
      padding: 0 18px;
      text-align: center;
      font: 1rem 'Ovo', Georgia, serif;
      color: var(--ink);
      outline: none;
    }

    .password-input:focus {
      border-color: rgba(82,106,132,0.70);
      box-shadow: 0 0 0 4px rgba(82,106,132,0.12);
    }

    .unlock-button {
      min-height: 48px;
      border: 0;
      border-radius: 999px;
      padding: 0 24px;
      background: var(--button);
      color: white;
      cursor: pointer;
      font: 1rem 'Ovo', Georgia, serif;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .unlock-button:hover { transform: translateY(-1px); background: #607b98; }

    .password-message {
      min-height: 20px;
      font-size: 0.92rem;
      color: var(--rose);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @media (max-width: 620px) {
      body { background-attachment: scroll; }
      .landing-card { min-height: auto; padding-top: 64px; padding-bottom: 48px; }
      .art.top-watercolour { width: 88vw; }
      .art.top-rose { width: 58vw; }
      .art.bottom-watercolour { width: 88vw; }
      .art.bottom-thistle { width: 58vw; }
    }
  </style>
</head>

<body>
  <img class="art top-watercolour" src="assets/top-right-watercolour.png" alt="" aria-hidden="true" />
  <img class="art top-rose" src="assets/rose-top-right.png" alt="" aria-hidden="true" />
  <img class="art top-splatter" src="assets/top-right-splatters.png" alt="" aria-hidden="true" />
  <img class="art bottom-watercolour" src="assets/bottom-left-watercolour.png" alt="" aria-hidden="true" />
  <img class="art bottom-thistle" src="assets/thistle-bottom-left.png" alt="" aria-hidden="true" />
  <img class="art bottom-splatter" src="assets/bottom-left-splatters.png" alt="" aria-hidden="true" />

  <main class="page">
    <section class="landing-card">
      <p class="eyebrow">Together<br />with their families</p>

      <h1>Tina<span class="ampersand">&amp;</span>Derek</h1>

      <p class="subtitle">
        Invite you to celebrate love, laughter,<br />
        and their happily ever after together.
      </p>

      <a class="envelope-link locked" id="inviteLink" href="main.html">
        <div class="envelope">
          <div class="envelope-flap"></div>
          <div class="envelope-base"></div>
          <div class="seal">♥</div>
        </div>
        <p class="open-note">Invitation locked</p>
      </a>

      <form class="password-panel" id="passwordForm">
        <label class="password-label" for="weddingPassword">Enter the wedding password</label>
        <div class="password-row">
          <input class="password-input" id="weddingPassword" type="password" autocomplete="off" placeholder="Wedding password" />
          <button class="unlock-button" type="submit">Unlock</button>
        </div>
        <p class="password-message" id="passwordMessage"></p>
      </form>
    </section>
  </main>

  <script>
    const correctPassword = "Auchen2027";
    const passwordForm = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("weddingPassword");
    const passwordMessage = document.getElementById("passwordMessage");
    const inviteLink = document.getElementById("inviteLink");
    const openNote = document.querySelector(".open-note");

    if (sessionStorage.getItem("weddingInviteUnlocked") === "true") {
      unlockInvite();
    }

    passwordForm.addEventListener("submit", function(event) {
      event.preventDefault();

      if (passwordInput.value.trim() === correctPassword) {
        sessionStorage.setItem("weddingInviteUnlocked", "true");
        unlockInvite();
        window.location.href = "main.html";
      } else {
        passwordMessage.textContent = "Sorry, that password is not quite right.";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    function unlockInvite() {
      inviteLink.classList.remove("locked");
      openNote.textContent = "Tap to open";
      passwordForm.style.display = "none";
    }
  </script>
</body>
</html>
