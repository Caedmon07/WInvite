<!DOCTYPE html>
<html lang="en-GB">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Tina & Derek Wedding Invitation
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Ovo&family=Parisienne&display=swap"
    rel="stylesheet"
  />

  <style>

    :root {

      --ink: #2d3340;

      --blue: #526a84;

      --rose: #8c3348;

      --paper-line:
        rgba(90, 100, 120, 0.16);

      --panel:
        rgba(255,255,255,0.78);
    }

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;
    }

    body {

      min-height: 100vh;

      font-family:
        "Ovo",
        serif;

      background:
        #dfe8f0;

      color: var(--ink);

      overflow-x: hidden;
    }

    .page {

      min-height: 100vh;

      display: grid;

      place-items: center;

      padding: 32px 16px;
    }

    .landing-card {

      position: relative;

      width:
        min(100%, 760px);

      min-height: 980px;

      padding:
        clamp(40px, 6vw, 72px);

      background:
        url("base-watercolour.png")
        center / cover no-repeat;

      border:
        1px solid var(--paper-line);

      border-radius: 4px;

      box-shadow:
        0 24px 70px rgba(22,32,48,0.14);

      overflow: hidden;
    }

    .landing-card::before {

      content: "";

      position: absolute;

      inset: 0;

      background:

        url("rose-top-right.png")
        top left / 220px auto no-repeat,

        url("top-right-watercolour.png")
        top right / 330px auto no-repeat,

        url("top-right-splatters.png")
        top right / 390px auto no-repeat,

        url("thistle-bottom-left.png")
        bottom right / 230px auto no-repeat,

        url("bottom-left-watercolour.png")
        bottom left / 340px auto no-repeat,

        url("bottom-left-splatters.png")
        bottom left / 390px auto no-repeat;

      pointer-events: none;

      z-index: 0;
    }

    .content {

      position: relative;

      z-index: 2;

      max-width: 560px;

      margin: 0 auto;

      background:
        var(--panel);

      padding:
        38px 30px;

      border-radius: 26px;

      border:
        1px solid rgba(82,106,132,0.10);

      box-shadow:
        0 10px 28px rgba(44,56,76,0.08);

      text-align: center;
    }

    .eyebrow {

      text-transform: uppercase;

      letter-spacing: 0.18em;

      line-height: 1.7;

      font-size:
        clamp(1rem, 2.4vw, 1.45rem);

      margin-bottom: 28px;
    }

    h1 {

      font-family:
        "Parisienne",
        cursive;

      font-size:
        clamp(5.2rem, 14vw, 8.7rem);

      line-height: 0.9;

      font-weight: 400;

      color: var(--ink);

      margin-bottom: 34px;
    }

    .subtitle {

      font-size:
        clamp(1.1rem, 3vw, 1.45rem);

      line-height: 1.6;

      margin-bottom: 34px;
    }

    .envelope-link {

      display: inline-block;

      text-decoration: none;

      color: inherit;

      transition: 0.3s ease;
    }

    .envelope-link.locked {

      opacity: 0.45;

      pointer-events: none;

      filter: grayscale(0.2);
    }

    .envelope {

      position: relative;

      width:
        min(76vw, 340px);

      height: 210px;

      margin:
        0 auto 16px;

      animation:
        float 3s ease-in-out infinite;
    }

    .envelope-base {

      position: absolute;

      inset: 54px 0 0;

      background:
        linear-gradient(
          145deg,
          #fffaf0,
          #e7d8bd
        );

      border-radius:
        0 0 18px 18px;
    }

    .envelope-flap {

      position: absolute;

      left: 0;
      right: 0;
      top: 54px;

      height: 118px;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #e8d9bd
        );

      clip-path:
        polygon(
          0 0,
          50% 100%,
          100% 0
        );

      transform-origin:
        top center;

      transition:
        transform 0.7s ease;

      z-index: 3;
    }

    .seal {

      position: absolute;

      left: 50%;
      top: 122px;

      transform:
        translateX(-50%);

      width: 50px;
      height: 50px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #8c3348,
          #5c1c2f
        );

      color: white;

      display: grid;

      place-items: center;

      z-index: 4;

      font-size: 1.25rem;
    }

    .envelope-link:hover .envelope-flap {

      transform:
        rotateX(20deg);
    }

    .open-note {

      text-transform: uppercase;

      letter-spacing: 0.14em;

      font-size: 0.82rem;

      color:
        rgba(45,51,64,0.72);
    }

    .password-panel {

      margin-top: 30px;

      display: grid;

      gap: 14px;
    }

    .password-row {

      display: flex;

      gap: 10px;

      justify-content: center;

      flex-wrap: wrap;
    }

    .password-input {

      min-height: 48px;

      width:
        min(78vw, 260px);

      border-radius: 999px;

      border:
        1px solid rgba(82,106,132,0.22);

      background:
        rgba(255,255,255,0.94);

      padding:
        0 18px;

      text-align: center;

      font-family:
        "Ovo",
        serif;
    }

    .unlock-button {

      min-height: 48px;

      border: 0;

      border-radius: 999px;

      padding:
        0 22px;

      background:
        var(--blue);

      color: white;

      cursor: pointer;

      font-family:
        "Ovo",
        serif;
    }

    .password-message {

      min-height: 20px;

      color:
        var(--rose);

      font-size: 0.9rem;
    }

    @keyframes float {

      0%,100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-10px);
      }
    }

  </style>

</head>

<body>

<main class="page">

  <section class="landing-card">

    <div class="content">

      <p class="eyebrow">

        Together<br>
        with their families

      </p>

      <h1>

        Tina<br>
        &amp;<br>
        Derek

      </h1>

      <p class="subtitle">

        Invite you to celebrate love,
        laughter,<br>

        and their happily ever after together.

      </p>

      <a
        class="envelope-link locked"
        id="inviteLink"
        href="main.html"
      >

        <div class="envelope">

          <div class="envelope-flap"></div>

          <div class="envelope-base"></div>

          <div class="seal">♥</div>

        </div>

        <p class="open-note">
          Invitation locked
        </p>

      </a>

      <form
        class="password-panel"
        id="passwordForm"
      >

        <div class="password-row">

          <input
            class="password-input"
            id="weddingPassword"
            type="password"
            placeholder="Wedding password"
            autocomplete="off"
          >

          <button
            class="unlock-button"
            type="submit"
          >

            Unlock

          </button>

        </div>

        <p
          class="password-message"
          id="passwordMessage"
        ></p>

      </form>

    </div>

  </section>

</main>

<script>

const correctPassword =
  "Auchen2027";

const passwordForm =
  document.getElementById("passwordForm");

const passwordInput =
  document.getElementById("weddingPassword");

const passwordMessage =
  document.getElementById("passwordMessage");

const inviteLink =
  document.getElementById("inviteLink");

const openNote =
  document.querySelector(".open-note");

if (
  localStorage.getItem(
    "weddingInviteUnlocked"
  ) === "true"
) {

  unlockInvite();
}

passwordForm.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();

    if (
      passwordInput.value.trim()
      === correctPassword
    ) {

      localStorage.setItem(
        "weddingInviteUnlocked",
        "true"
      );

      unlockInvite();

      window.location.href =
        "main.html";

    } else {

      passwordMessage.textContent =
        "Sorry, that password is not quite right.";

      passwordInput.value = "";
    }

  }
);

function unlockInvite() {

  inviteLink.classList.remove("locked");

  openNote.textContent =
    "Tap to open";

  passwordForm.style.display =
    "none";
}

</script>

</body>
</html>
